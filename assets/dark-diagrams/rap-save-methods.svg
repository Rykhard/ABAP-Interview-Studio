<svg width="880" height="510" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 510" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>...</title>
