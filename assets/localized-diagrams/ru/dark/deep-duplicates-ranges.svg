	<title id="deep-duplicates-ranges-ru-title">Дубликат INSERT и пустой список полномочий</title><desc>В указанной форме INSERT дубликат уникального ключа не заменяет исходную строку. Пустой selection range означает не то же самое, что отсутствие разрешённых значений.</desc><clipPath id="deep-duplicates-ranges-ru-clip">
