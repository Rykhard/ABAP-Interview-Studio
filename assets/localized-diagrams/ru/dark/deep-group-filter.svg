<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="deep-group-filter-ru-title" lang="ru" class="selectable-diagram">
	<title id="deep-group-filter-ru-title">Группы без сортировки и явные ключи FILTER</title><desc>Несоседние строки A попадают в одну группу. Итог рассчитывается по всем её элементам, а не берётся из строки-представителя.</desc><clipPath id="deep-group-filter-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
