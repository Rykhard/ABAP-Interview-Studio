<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="remote-transaction-boundary-ru-title" lang="ru" class="selectable-diagram">
	<title id="remote-transaction-boundary-ru-title">Границы локальной и удалённой транзакций</title><desc>Удалённый COMMIT фиксирует данные в другой системе. Для последующей локальной ошибки нужен отдельный способ восстановления.</desc><clipPath id="remote-transaction-boundary-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="remote-transaction-boundary-ru-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#remote-transaction-boundary-ru-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #10191f; fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">Локальный ROLLBACK не отменяет удалённый COMMIT</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #aabdc6; stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Для двух систем нужен план восстановления</text>
			<rect x="43" y="280" width="342" height="157" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="43" y="398" width="342" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="57" y="411" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,822) scale(1,-1)" data-label-width="320.0">Система A: локальный заказ</text>
			<text x="57" y="373" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,746) scale(1,-1)" data-label-width="320.0" textLength="320.0" lengthAdjust="spacingAndGlyphs">Начинаем работу. Вызываем удалённую операцию.</text>
			<text x="57" y="354" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,708) scale(1,-1)" data-label-width="320.0">Затем локальное сохранение не удаётся.</text>
			<rect x="493" y="280" width="342" height="157" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="493" y="398" width="342" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="507" y="411" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,822) scale(1,-1)" data-label-width="320.0">Система B: удалённый сервис</text>
			<text x="507" y="373" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,746) scale(1,-1)" data-label-width="320.0">Принимает операцию и сохраняет</text>
			<text x="507" y="354" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,708) scale(1,-1)" data-label-width="320.0">изменение в своей транзакции.</text>
			<path d="M 393,356 L 485,356 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="485 356, 475 351, 475 361" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<text x="408" y="380" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,760) scale(1,-1)" data-label-width="464.0">запрос</text>
			<rect x="43" y="114" width="342" height="124" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="43" y="199" width="342" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="57" y="212" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,424) scale(1,-1)" data-label-width="320.0">Ошибочное предположение</text>
			<text x="57" y="174" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,348) scale(1,-1)" data-label-width="320.0">ROLLBACK в A отменяет и B. Такой</text>
			<text x="57" y="155" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,310) scale(1,-1)" data-label-width="320.0">автоматической гарантии нет.</text>
			<rect x="493" y="114" width="342" height="124" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="493" y="199" width="342" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="507" y="212" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,424) scale(1,-1)" data-label-width="320.0">Явное восстановление</text>
			<text x="507" y="174" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,348) scale(1,-1)" data-label-width="320.0">Где поддержано: транзакционная</text>
			<text x="507" y="155" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,310) scale(1,-1)" data-label-width="320.0">доставка, идемпотентность, повторы,</text>
			<text x="507" y="136" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,272) scale(1,-1)" data-label-width="320.0">при нужде — компенсация.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">Определите владельца, correlation ID, мониторинг и сверку. Не обещайте exactly-once delivery</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">без подтверждения.</text>
		</g>
	</g>
</svg>