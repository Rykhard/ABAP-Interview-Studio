			<text x="48" y="410" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,820) scale(1,-1)" data-label-width="230.0">Язык / API</text>
			<text x="48" y="372" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,744) scale(1,-1)" data-label-width="230.0">Допустимый синтаксис, released</text>
			<text x="48" y="353" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,706) scale(1,-1)" data-label-width="230.0">зависимости и видимость.</text>
			<rect x="314" y="266" width="252" height="170" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="314" y="397" width="252" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="328" y="410" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,820) scale(1,-1)" data-label-width="230.0">Контракт BO</text>
			<text x="328" y="372" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,744) scale(1,-1)" data-label-width="230.0">Строгие правила behavior,</text>
			<text x="328" y="353" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,706) scale(1,-1)" data-label-width="230.0">права, транзакции и</text>
			<text x="328" y="334" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,668) scale(1,-1)" data-label-width="230.0">совместимость.</text>
			<rect x="594" y="266" width="252" height="170" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="594" y="397" width="252" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="608" y="410" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,820) scale(1,-1)" data-label-width="230.0">Проверка поставки</text>
			<text x="608" y="372" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,744) scale(1,-1)" data-label-width="230.0" textLength="230.0" lengthAdjust="spacingAndGlyphs">Целевая активация, доступ к сервису,</text>
			<text x="608" y="353" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,706) scale(1,-1)" data-label-width="230.0">тесты и восстановление.</text>
			<path d="M 291,349 L 308,349 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="308 349, 298 344, 298 354" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<path d="M 571,349 L 588,349 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="588 349, 578 344, 578 354" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<text x="48" y="198" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #e7eff2; stroke:none;" transform="translate(0,396) scale(1,-1)" data-label-width="824.0">Released BO interface может предоставлять более узкий контракт, чем внутренняя</text>
			<text x="48" y="178" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #e7eff2; stroke:none;" transform="translate(0,356) scale(1,-1)" data-label-width="824.0">реализация. Используйте разрешённый слой, даже если ADT показывает другие объекты.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">strict(2), C1 release и работающий service binding — разные факты. Ни один сам по себе не доказывает</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">готовность к production.</text>
