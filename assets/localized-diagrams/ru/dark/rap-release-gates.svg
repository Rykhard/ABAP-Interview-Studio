<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="rap-release-gates-ru-title" lang="ru" class="selectable-diagram">
	<title id="rap-release-gates-ru-title">Проверки допуска и использования RAP</title><desc>Отдельно проверяйте разрешённость API, правильность поведения и готовность поставки. Для каждого вывода нужны свои доказательства.</desc><clipPath id="rap-release-gates-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="rap-release-gates-ru-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#rap-release-gates-ru-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #10191f; fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">Проверка языка — лишь один этап готовности релиза</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #aabdc6; stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">От допустимого кода — к контракту клиента и эксплуатации</text>
			<rect x="34" y="266" width="252" height="170" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
