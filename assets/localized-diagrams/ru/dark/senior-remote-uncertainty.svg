			<rect x="55" y="201" width="313" height="69" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="69" y="245" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #efb384; stroke:none;font-weight:700;" transform="translate(0,490) scale(1,-1)" data-label-width="291.0">Тайм-аут не означает «не оплачен»</text>
			<text x="69" y="222" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,444) scale(1,-1)" data-label-width="291.0">Записать Unknown; сверить REQ-42.</text>
			<polygon points="540 179, 540 297, 792 297, 792 179, 785 187, 778 179, 771 187, 764 179, 757 187, 750 179, 743 187, 736 179, 729 187, 722 179, 715 187, 708 179, 701 187, 694 179, 687 187, 680 179, 673 187, 666 179, 659 187, 652 179, 645 187, 638 179, 631 187, 624 179, 617 187, 610 179, 603 187, 596 179, 589 187, 582 179, 575 187, 568 179, 561 187, 554 179, 547 187, 540 179, 533 187, 540 179" style="stroke: #9bdac1; stroke-linecap: butt; stroke-width: 1; fill: #203c35; fill-rule: evenodd;" />
			<text x="558" y="270" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #e7eff2; stroke:none;" transform="translate(0,540) scale(1,-1)" data-label-width="273.0">КВИТАНЦИЯ</text>
			<text x="558" y="247" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #e7eff2; stroke:none;" transform="translate(0,494) scale(1,-1)" data-label-width="273.0">REQ-42  /  PAY-900</text>
			<text x="558" y="224" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #e7eff2; stroke:none;" transform="translate(0,448) scale(1,-1)" data-label-width="273.0">Статус: оплачен</text>
			<text x="558" y="201" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #e7eff2; stroke:none;" transform="translate(0,402) scale(1,-1)" data-label-width="273.0">Платёж уже существует.</text>
			<text x="40" y="115" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,230) scale(1,-1)" data-label-width="832.0">Восстановление по ключу: запросить статус или использовать контракт идемпотентности.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">Локальный rollback не удалит PAY-900. Слепой повтор неидемпотентной операции может создать второй</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">платёж; компенсация — отдельная бизнес-операция.</text>
		</g>
	</g>
</svg>