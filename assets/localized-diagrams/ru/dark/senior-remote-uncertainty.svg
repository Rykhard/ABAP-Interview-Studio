<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="senior-remote-uncertainty-ru-title" lang="ru" class="selectable-diagram">
	<title id="senior-remote-uncertainty-ru-title">Удалённый COMMIT и неизвестный локальный результат</title><desc>Приложение надёжно сохраняет намерение до независимой доставки. Удалённый платёж выполняет COMMIT, но ответ теряется. При восстановлении существующий результат ищут по REQ-42.</desc><clipPath id="senior-remote-uncertainty-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="senior-remote-uncertainty-ru-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#senior-remote-uncertainty-ru-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #10191f; fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">Потерянный ответ — неизвестный результат</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #aabdc6; stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Пример восстановления: ключ REQ-42; квитанция удалённого платежа PAY-900</text>
			<rect x="38" y="160" width="347" height="292" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="492" y="160" width="347" height="292" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="55" y="424" style="font-family:Arial,Helvetica,sans-serif; font-size: 18px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,848) scale(1,-1)" data-label-width="322.0">ЛОКАЛЬНЫЙ ЗАПРОС</text>
			<text x="509" y="424" style="font-family:Arial,Helvetica,sans-serif; font-size: 18px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,848) scale(1,-1)" data-label-width="322.0">УДАЛЁННЫЙ ПЛАТЁЖ</text>
			<text x="55" y="389" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,778) scale(1,-1)" data-label-width="322.0">REQ-42</text>
			<text x="55" y="366" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,732) scale(1,-1)" data-label-width="322.0">Надёжно сохранить Pending.</text>
			<text x="55" y="343" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,686) scale(1,-1)" data-label-width="322.0">Назначить ответственного за повторы.</text>
			<text x="509" y="389" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,778) scale(1,-1)" data-label-width="322.0">REQ-42 получен</text>
			<text x="509" y="366" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,732) scale(1,-1)" data-label-width="322.0">Удалённая транзакция фиксирует платёж.</text>
			<text x="509" y="343" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,686) scale(1,-1)" data-label-width="322.0">Квитанция: PAY-900</text>
