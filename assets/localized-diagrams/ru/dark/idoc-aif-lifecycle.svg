			<text x="614" y="373" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,746) scale(1,-1)" data-label-width="220.0">Проверьте результат</text>
			<text x="614" y="354" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,708) scale(1,-1)" data-label-width="220.0">проводки и связь</text>
			<text x="614" y="335" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,670) scale(1,-1)" data-label-width="220.0">с исходным сообщением</text>
			<text x="614" y="316" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,632) scale(1,-1)" data-label-width="220.0">интерфейса.</text>
