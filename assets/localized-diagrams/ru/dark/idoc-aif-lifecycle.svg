			<text x="49" y="373" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,746) scale(1,-1)" data-label-width="228.0">Control: маршрут. Data:</text>
			<text x="49" y="354" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,708) scale(1,-1)" data-label-width="228.0">сегменты. Status:</text>
			<text x="49" y="335" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,670) scale(1,-1)" data-label-width="228.0">история обработки.</text>
			<rect x="321" y="282" width="241" height="155" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="321" y="398" width="241" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="335" y="411" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,822) scale(1,-1)" data-label-width="219.0">Обработка приложения</text>
			<text x="335" y="373" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,746) scale(1,-1)" data-label-width="219.0">Партнёры и настройки;</text>
			<text x="335" y="354" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,708) scale(1,-1)" data-label-width="219.0">mapping, проверки</text>
			<text x="335" y="335" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,670) scale(1,-1)" data-label-width="219.0">и бизнес-логика.</text>
			<rect x="600" y="282" width="242" height="155" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
