<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="idoc-aif-lifecycle-ru-title" lang="ru" class="selectable-diagram">
	<title id="idoc-aif-lifecycle-ru-title">Обработка IDoc и работа с AIF</title><desc>Проследите сообщение до бизнес-результата. Полоса AIF обозначает настроенные возможности, а не обязательный этап каждого IDoc.</desc><clipPath id="idoc-aif-lifecycle-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
