			<text x="54" y="216" style="font-family:Arial,Helvetica,sans-serif; font-size: 18px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,432) scale(1,-1)" data-label-width="780.0">AIF: настроенный мониторинг и обработка ошибок</text>
			<text x="54" y="186" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,372) scale(1,-1)" data-label-width="780.0">Покажите бизнес-ключи и ошибки уполномоченным пользователям. Устраните причину, затем</text>
			<text x="54" y="167" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,334) scale(1,-1)" data-label-width="780.0">повторите обработку штатным механизмом. Не создайте второй бизнес-результат.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">OData — протокол сервиса, IDoc — технология сообщений, AIF — framework. Это не три</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">взаимозаменяемых транспорта.</text>
