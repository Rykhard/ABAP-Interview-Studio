			<text x="48" y="385" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,770) scale(1,-1)" data-label-width="221.0">&lt;= 500 EUR</text>
			<text x="48" y="350" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,700) scale(1,-1)" data-label-width="221.0">Не подходит</text>
