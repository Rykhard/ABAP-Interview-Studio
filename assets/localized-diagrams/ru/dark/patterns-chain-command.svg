			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #aabdc6; stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Запрос на 700 EUR. Правила по порядку выбирают первого подходящего согласующего.</text>
