	<title id="patterns-chain-command-ru-title">Первое подходящее правило и идемпотентная Command</title><desc>Запрос на 700 EUR проходит правило руководителя группы и останавливается на правиле менеджера. Для безопасной повторной доставки операции нужен сохраняемый идентификатор.</desc><clipPath id="patterns-chain-command-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
