	<title id="deep-sql-inputs-ru-title">Данные запроса и SQL-идентификаторы</title><desc>Апостроф слева остаётся обычным символом данных. Справа пользователь выбирает сортировку из разрешённых вариантов, а не передаёт исполняемый SQL.</desc><clipPath id="deep-sql-inputs-ru-clip">
