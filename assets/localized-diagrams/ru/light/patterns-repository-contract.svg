	<title id="patterns-repository-contract-ru-title">Repository: правильное состояние и полезная абстракция</title><desc>Прямое чтение БД возвращает 100, хотя транзакция уже видит 120. Repository полезен для подмены в тестах, только если настоящая реализация читает нужное клиенту состояние.</desc><clipPath id="patterns-repository-contract-ru-clip">
