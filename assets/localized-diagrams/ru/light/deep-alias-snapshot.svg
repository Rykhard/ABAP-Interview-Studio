	<title id="deep-alias-snapshot-ru-title">Независимые значения и общий объект по ссылке</title><desc>Две структуры содержат независимые строки, но ссылаются на один объект расчёта цены. Поэтому getter может открыть доступ к изменяемому состоянию.</desc><clipPath id="deep-alias-snapshot-ru-clip">
