	<title id="patterns-factory-families-ru-title">Варианты Factory и совместимое семейство объектов</title><desc>Общее семейство не даёт случайно соединить сериализатор A с отправителем B. Таблица различает простой выбор класса, создание через подкласс и создание связанных продуктов.</desc><clipPath id="patterns-factory-families-ru-clip">
