<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="odata-batch-envelope-ru-title" lang="ru" class="selectable-diagram">
	<title id="odata-batch-envelope-ru-title">OData batch: контейнер запросов и атомарные группы</title><desc>Общий контейнер уменьшает накладные расходы HTTP, но сам по себе не объединяет всё в одну транзакцию БД.</desc><clipPath id="odata-batch-envelope-ru-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="odata-batch-envelope-ru-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#odata-batch-envelope-ru-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(95%,96%,96%); fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">В одном HTTP batch могут быть разные транзакции</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Атомарность задаёт группа, а не внешняя оболочка</text>
			<rect x="38" y="115" width="804" height="324" rx="8" ry="8" style="stroke: rgb(7%,16%,24%); stroke-linecap: butt; stroke-width: 1; fill: rgb(89%,92%,94%); fill-rule: evenodd;" />
			<text x="56" y="410" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,820) scale(1,-1)" data-label-width="778.0">ОБОЛОЧКА HTTP BATCH</text>
			<rect x="61" y="182" width="235" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="61" y="324" width="235" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="75" y="337" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,674) scale(1,-1)" data-label-width="213.0">Атомарная группа A</text>
			<text x="75" y="299" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,598) scale(1,-1)" data-label-width="213.0">Правка заказа + новая позиция.</text>
			<text x="75" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="213.0">Ошибка внутри группы</text>
			<text x="75" y="261" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,522) scale(1,-1)" data-label-width="213.0">исключает частичный успех</text>
			<text x="75" y="242" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,484) scale(1,-1)" data-label-width="213.0">в пределах этой группы.</text>
			<rect x="324" y="182" width="235" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="324" y="324" width="235" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="338" y="337" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,674) scale(1,-1)" data-label-width="213.0">Атомарная группа B</text>
			<text x="338" y="299" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,598) scale(1,-1)" data-label-width="213.0">У отдельной группы</text>
			<text x="338" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="213.0">своя граница атомарности.</text>
			<text x="338" y="261" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,522) scale(1,-1)" data-label-width="213.0">Нельзя считать, что A</text>
			<text x="338" y="242" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,484) scale(1,-1)" data-label-width="213.0">откатит группу B.</text>
			<rect x="587" y="182" width="230" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="587" y="324" width="230" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="601" y="337" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,674) scale(1,-1)" data-label-width="208.0">Другой запрос</text>
			<text x="601" y="299" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,598) scale(1,-1)" data-label-width="208.0">В оболочке также</text>
			<text x="601" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="208.0">может быть чтение</text>
			<text x="601" y="261" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,522) scale(1,-1)" data-label-width="208.0">или иной запрос,</text>
			<text x="601" y="242" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,484) scale(1,-1)" data-label-width="208.0">если протокол допускает.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,94%,88%); fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">OData V2 changesets и OData V4 atomicity groups имеют свои правила. Проверьте поддержку сервиса и</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">зависимости.</text>
		</g>
	</g>
</svg>