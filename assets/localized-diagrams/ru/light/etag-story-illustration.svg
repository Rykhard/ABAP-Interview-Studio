<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" role="img" aria-labelledby="etag-story-illustration-ru-title" lang="ru" class="selectable-diagram"><title id="etag-story-illustration-ru-title">Два редактора и одна версия: история ETag</title><desc>Анна и Борис читают версию 7. Анна сохраняет изменение, и появляется версия 8. Запрос Бориса со старой версией 7 не должен затереть новые данные.</desc><rect x="0" y="0" width="880" height="580" rx="8" fill="rgb(95%,96%,96%)" /><rect x="24" y="35" width="832" height="154" rx="8" fill="rgb(100%,100%,100%)" /><text x="42" y="67" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:rgb(7%,39%,32%);" data-label-width="806.0">1. Оба читают V7</text><text x="42" y="100" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">Alice и Ben читают одну запись. Оба получают текущий ETag, здесь</text><text x="42" y="123" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">обозначенный как V7.</text><rect x="24" y="209" width="832" height="154" rx="8" fill="rgb(100%,100%,100%)" /><text x="42" y="241" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:rgb(7%,39%,32%);" data-label-width="806.0">2. Alice сохраняет</text><text x="42" y="274" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">Её If-Match V7 совпадает с текущей версией. Изменение сохраняется, запись</text><text x="42" y="297" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">получает новый ETag — V8.</text><rect x="24" y="383" width="832" height="154" rx="8" fill="rgb(100%,100%,100%)" /><text x="42" y="415" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:rgb(7%,39%,32%);" data-label-width="806.0">3. Версия Ben устарела</text><text x="42" y="448" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">Его If-Match V7 уже не совпадает с V8. Изменение отклоняется: нужно</text><text x="42" y="471" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">перечитать данные и разрешить конфликт.</text></svg>