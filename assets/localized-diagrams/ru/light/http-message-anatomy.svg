<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="http-message-anatomy-ru-title" lang="ru" class="selectable-diagram">
	<title id="http-message-anatomy-ru-title">Устройство HTTP-запроса и ответа</title><desc>До чтения тела проверьте метод, адрес, статус и заголовки. В примере используется условный домен.</desc><clipPath id="http-message-anatomy-ru-clip">
