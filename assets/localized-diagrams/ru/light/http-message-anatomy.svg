			<text x="544" y="115" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(7%,39%,32%); stroke:none;font-weight:700;" transform="translate(0,230) scale(1,-1)" data-label-width="328.0">Представление / JSON</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,94%,88%); fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">REST — архитектурный стиль; JSON и XML — форматы данных. OData добавляет правила сервиса поверх</text>
