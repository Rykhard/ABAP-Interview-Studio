<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="rap-two-etag-boundaries-ru-title" lang="ru" class="selectable-diagram">
	<title id="rap-two-etag-boundaries-ru-title">Две границы ETag</title><desc>Слева — изменение сущности с проверкой версии. Справа — проверка активного состояния, на котором основан возобновляемый draft.</desc><clipPath id="rap-two-etag-boundaries-ru-clip">
