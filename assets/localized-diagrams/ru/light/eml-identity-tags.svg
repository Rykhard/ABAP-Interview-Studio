	<title id="eml-identity-tags-ru-title">Идентификаторы в EML</title><desc>Content IDs связывают записи внутри запроса. Транзакционные и предварительные идентификаторы решают другие задачи жизненного цикла.</desc><clipPath id="eml-identity-tags-ru-clip">
