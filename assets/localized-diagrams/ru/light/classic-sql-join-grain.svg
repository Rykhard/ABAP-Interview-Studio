	<title id="classic-sql-join-grain-ru-title">Размножение строк при SQL JOIN</title><desc>JOIN двух заголовков с тремя позициями повторяет сумму заказа 10: простой итог увеличивается со 180 EUR до 280 EUR. При OUTER JOIN условие ON может сохранить левую строку без пары, а условие правой таблицы в WHERE — исключить её.</desc><clipPath id="classic-sql-join-grain-ru-clip">
