<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" role="img" aria-labelledby="draft-storage-illustration-en-title" lang="en" class="selectable-diagram"><title id="draft-storage-illustration-en-title">Three storage lifetimes: an illustrated analogy</title><desc>The desk represents the current transactional buffer; the draft cabinet represents persistent work across requests; the shared archive represents saved active data.</desc><rect x="0" y="0" width="880" height="580" rx="8" fill="#10191f" /><rect x="24" y="35" width="832" height="154" rx="8" fill="#192730" /><text x="42" y="67" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:#9bdac1;" data-label-width="806.0">Transaction buffer</text><text x="42" y="100" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:#e7eff2;" data-label-width="806.0">Working changes for the current transaction. It is not the persisted draft.</text><rect x="24" y="209" width="832" height="154" rx="8" fill="#192730" /><text x="42" y="241" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:#9bdac1;" data-label-width="806.0">Persistent draft</text><text x="42" y="274" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:#e7eff2;" data-label-width="806.0">Saved unfinished work that can survive separate requests. It is not yet the</text><text x="42" y="297" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:#e7eff2;" data-label-width="806.0">active business state.</text><rect x="24" y="383" width="832" height="154" rx="8" fill="#192730" /><text x="42" y="415" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:#9bdac1;" data-label-width="806.0">Active data</text><text x="42" y="448" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:#e7eff2;" data-label-width="806.0">The saved business state. Draft activation must pass the applicable checks</text><text x="42" y="471" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:#e7eff2;" data-label-width="806.0">before updating it.</text></svg>