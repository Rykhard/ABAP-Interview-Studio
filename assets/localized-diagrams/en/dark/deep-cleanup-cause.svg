	<title id="deep-cleanup-cause-en-title">Exceptional exits and preserved causes</title><desc>The table names three exit paths that require separate reasoning. The exception chain carries the lower-level diagnosis through a meaningful service-level failure.</desc><clipPath id="deep-cleanup-cause-en-clip">
