<svg xmlns="http://www.w3.org/2000/svg" width="880" height="740" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 740" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="rap-save-sequence-en-title" lang="en" class="selectable-diagram">
	<title id="rap-save-sequence-en-title">RAP save sequence and early failure path</title><desc>Follow one order from total calculation to buffer cleanup. The orange branch stops a rejected save before late numbering and persistence.</desc><clipPath id="rap-save-sequence-en-clip">
		<rect x="0" y="0" width="880" height="740" />
	</clipPath>
	<g id="rap-save-sequence-en-group" transform="scale(1,-1) translate(0,-740)" style="clip-path: url(#rap-save-sequence-en-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="740" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #10191f; fill-rule: evenodd;" />
			<text x="28" y="704" style="font-family:Arial,Helvetica,sans-serif; font-size: 23px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,1408) scale(1,-1)" data-label-width="844.0">RAP save sequence: one order, step by step</text>
			<text x="28" y="680" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #aabdc6; stroke:none;" transform="translate(0,1360) scale(1,-1)" data-label-width="844.0">Prepare and check first. Then assign the final number and write.</text>
			<rect x="28" y="582" width="530" height="80" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="42" y="639" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,1278) scale(1,-1)" data-label-width="508.0">1  FINALIZE</text>
			<text x="42" y="616" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,1232) scale(1,-1)" data-label-width="508.0">Calculate the order total.</text>
			<text x="42" y="595" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,1190) scale(1,-1)" data-label-width="508.0">Last phase for allowed buffer changes.</text>
			<rect x="28" y="482" width="530" height="80" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="42" y="539" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,1078) scale(1,-1)" data-label-width="508.0">2  CHECK_BEFORE_SAVE</text>
			<text x="42" y="516" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,1032) scale(1,-1)" data-label-width="508.0">Check that the delivery date is valid.</text>
			<text x="42" y="495" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,990) scale(1,-1)" data-label-width="508.0">All involved BOs must pass the checks.</text>
			<rect x="28" y="336" width="530" height="80" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="42" y="393" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,786) scale(1,-1)" data-label-width="508.0">3  ADJUST_NUMBERS  (late numbering)</text>
			<text x="42" y="370" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,740) scale(1,-1)" data-label-width="508.0">Assign final document number 4711.</text>
			<text x="42" y="349" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,698) scale(1,-1)" data-label-width="508.0">Skip this assignment when using early numbering.</text>
			<rect x="28" y="236" width="530" height="80" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="42" y="293" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,586) scale(1,-1)" data-label-width="508.0">4  SAVE  (persistence phase)</text>
			<text x="42" y="270" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,540) scale(1,-1)" data-label-width="508.0">Write the order and its items.</text>
			<text x="42" y="249" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,498) scale(1,-1)" data-label-width="508.0">The implementation depends on the save option.</text>
			<rect x="28" y="86" width="530" height="80" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="42" y="143" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,286) scale(1,-1)" data-label-width="508.0">5  CLEANUP</text>
			<text x="42" y="120" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,240) scale(1,-1)" data-label-width="508.0">Clear transaction-local working data.</text>
			<text x="42" y="99" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,198) scale(1,-1)" data-label-width="508.0">The next LUW must not inherit old buffer entries.</text>
			<path d="M 290,579 L 290,565 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="290 565, 285 575, 295 575" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<path d="M 290,479 L 290,419 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="290 419, 285 429, 295 429" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<path d="M 290,333 L 290,319 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="290 319, 285 329, 295 329" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<path d="M 290,233 L 290,169 Z" style="stroke: #aabdc6; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="290 169, 285 179, 295 179" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #aabdc6; fill-rule: evenodd;" />
			<rect x="30" y="434" width="526" height="35" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #203c35; fill-rule: evenodd;" />
			<text x="43" y="446" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,892) scale(1,-1)" data-label-width="505.0">POINT OF NO RETURN: after all checks pass</text>
			<rect x="30" y="187" width="526" height="35" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #203c35; fill-rule: evenodd;" />
			<text x="43" y="199" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,398) scale(1,-1)" data-label-width="505.0">Transaction owner completes the database commit</text>
			<rect x="606" y="460" width="246" height="196" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="620" y="630" style="font-family:Arial,Helvetica,sans-serif; font-size: 17px;fill: #efb384; stroke:none;font-weight:700;" transform="translate(0,1260) scale(1,-1)" data-label-width="224.0">Early failure path</text>
			<text x="620" y="601" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,1202) scale(1,-1)" data-label-width="224.0">FINALIZE or CHECK_BEFORE_SAVE</text>
			<text x="620" y="583" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,1166) scale(1,-1)" data-label-width="224.0">fails in any involved BO.</text>
			<text x="620" y="539" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #efb384; stroke:none;font-weight:700;" transform="translate(0,1078) scale(1,-1)" data-label-width="224.0">CLEANUP_FINALIZE</text>
			<text x="620" y="513" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,1026) scale(1,-1)" data-label-width="224.0">Run early-failure cleanup;</text>
			<text x="620" y="495" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,990) scale(1,-1)" data-label-width="224.0">do not continue to late</text>
			<text x="620" y="477" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,954) scale(1,-1)" data-label-width="224.0">saving.</text>
			<path d="M 560,623 L 602,623 Z" style="stroke: #efb384; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="602 623, 592 618, 592 628" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #efb384; fill-rule: evenodd;" />
			<path d="M 560,524 L 602,524 Z" style="stroke: #efb384; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="602 524, 592 519, 592 529" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #efb384; fill-rule: evenodd;" />
			<rect x="606" y="238" width="246" height="186" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<text x="620" y="397" style="font-family:Arial,Helvetica,sans-serif; font-size: 17px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,794) scale(1,-1)" data-label-width="224.0">Late save</text>
			<text x="620" y="371" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,742) scale(1,-1)" data-label-width="224.0">Ordinary business checks must</text>
			<text x="620" y="353" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,706) scale(1,-1)" data-label-width="224.0">already have passed. A</text>
			<text x="620" y="335" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,670) scale(1,-1)" data-label-width="224.0">technical failure is not</text>
			<text x="620" y="317" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,634) scale(1,-1)" data-label-width="224.0">impossible.</text>
			<text x="620" y="287" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,574) scale(1,-1)" data-label-width="224.0">Special BAPI failure handling</text>
			<text x="620" y="270" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,540) scale(1,-1)" data-label-width="224.0">needs the documented saver</text>
			<text x="620" y="253" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,506) scale(1,-1)" data-label-width="224.0">and release support.</text>
			<text x="28" y="48" style="font-family:Arial,Helvetica,sans-serif; font-size: 17px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,96) scale(1,-1)" data-label-width="844.0">Remember: calculate -&gt; check -&gt; number -&gt; write -&gt; clear.</text>
			<text x="28" y="24" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: #aabdc6; stroke:none;" transform="translate(0,48) scale(1,-1)" data-label-width="844.0">Runtime phases, not five methods you must implement in every BO. No commit inside a handler or saver.</text>
		</g>
	</g>
</svg>