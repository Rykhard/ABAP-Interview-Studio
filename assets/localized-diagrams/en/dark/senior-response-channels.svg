	<title id="senior-response-channels-en-title">FAILED, REPORTED, and MAPPED in a worked create</title><desc>Three input identities produce separate rejection, message, and key-correlation information. A message on C3 does not itself reject that input, and assigned keys do not prove durable persistence.</desc><clipPath id="senior-response-channels-en-clip">
