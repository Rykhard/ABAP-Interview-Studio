	<title id="classic-sql-join-grain-en-title">SQL join multiplication</title><desc>Joining two order headers to three items repeats order 10's total, inflating a naive sum from EUR 180 to EUR 280. For outer joins, matching conditions in ON can preserve unmatched left rows, while right-side conditions in WHERE can remove them.</desc><clipPath id="classic-sql-join-grain-en-clip">
