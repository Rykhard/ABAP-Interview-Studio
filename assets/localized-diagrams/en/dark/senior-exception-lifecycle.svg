<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="senior-exception-lifecycle-en-title" lang="en" class="selectable-diagram">
	<title id="senior-exception-lifecycle-en-title">Exception governance and review lifecycle</title><desc>A concrete exception record limits one dependency, states its evidence and owner, and defines review and exit triggers. A changed implementation must be assessed against that scope.</desc><clipPath id="senior-exception-lifecycle-en-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="senior-exception-lifecycle-en-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#senior-exception-lifecycle-en-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #10191f; fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">An exception is a bounded decision, not a new API contract</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #aabdc6; stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Illustrative governance record: EX-017 permits one reviewed internal read dependency</text>
			<rect x="35" y="183" width="406" height="275" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="35" y="413" width="406" height="45" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #e7eff2; fill-rule: evenodd;" />
			<text x="53" y="430" style="font-family:Arial,Helvetica,sans-serif; font-size: 17px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,860) scale(1,-1)" data-label-width="380.0">EX-017 / reviewable exception record</text>
			<text x="54" y="388" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,776) scale(1,-1)" data-label-width="379.0">Scope: adapter ZCL_LEGACY_READ, one read path</text>
			<text x="54" y="361" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,722) scale(1,-1)" data-label-width="379.0">Reason: required field absent from released query</text>
			<text x="54" y="334" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,668) scale(1,-1)" data-label-width="379.0">Owner: application team + named risk approver</text>
			<text x="54" y="307" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,614) scale(1,-1)" data-label-width="379.0">Evidence: denied-user and result-total tests</text>
			<text x="54" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="379.0">Review: next platform upgrade or API successor</text>
			<text x="54" y="253" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,506) scale(1,-1)" data-label-width="379.0">Exit: replace dependency; remove exemption</text>
			<text x="54" y="226" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,452) scale(1,-1)" data-label-width="379.0">Status: approved scope, not unrestricted access</text>
			<circle cx="504" cy="432" r="19" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="499.552" y="426" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,852) scale(1,-1)" data-label-width="16.0">1</text>
			<text x="539" y="440" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,880) scale(1,-1)" data-label-width="333.0">ASSESS</text>
			<text x="539" y="415" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,830) scale(1,-1)" data-label-width="333.0">Verify gap, scope, alternatives.</text>
			<circle cx="504" cy="353" r="19" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="499.552" y="347" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,694) scale(1,-1)" data-label-width="16.0">2</text>
			<text x="539" y="361" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,722) scale(1,-1)" data-label-width="333.0">DECIDE</text>
			<text x="539" y="336" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,672) scale(1,-1)" data-label-width="333.0">Approve risk and required controls.</text>
			<circle cx="504" cy="274" r="19" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="499.552" y="268" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,536) scale(1,-1)" data-label-width="16.0">3</text>
			<text x="539" y="282" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,564) scale(1,-1)" data-label-width="333.0">RECHECK</text>
			<text x="539" y="257" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,514) scale(1,-1)" data-label-width="333.0">Trigger: code, API, or release change.</text>
			<circle cx="504" cy="195" r="19" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="499.552" y="189" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,378) scale(1,-1)" data-label-width="16.0">4</text>
			<text x="539" y="203" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #9bdac1; stroke:none;font-weight:700;" transform="translate(0,406) scale(1,-1)" data-label-width="333.0">CLOSE OR RENEW</text>
			<text x="539" y="178" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,356) scale(1,-1)" data-label-width="333.0">Show replacement or fresh evidence.</text>
			<path d="M 504,406 L 504,388 Z" style="stroke: #9bdac1; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="504 388, 499 398, 509 398" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<path d="M 504,327 L 504,309 Z" style="stroke: #9bdac1; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="504 309, 499 319, 509 319" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<path d="M 504,248 L 504,230 Z" style="stroke: #9bdac1; stroke-linecap: butt; stroke-width: 2;" />
			<polygon points="504 230, 499 240, 509 240" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<rect x="36" y="105" width="807" height="53" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="52" y="126" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #efb384; stroke:none;font-weight:700;" transform="translate(0,252) scale(1,-1)" data-label-width="783.0">A new write call is outside EX-017. It needs a new decision, not silent inheritance.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">An exemption can change finding handling; it cannot legalize unsupported ABAP Cloud syntax, release a</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">SAP object, or prove transaction correctness.</text>
		</g>
	</g>
</svg>