<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="odata-batch-envelope-en-title" lang="en" class="selectable-diagram">
	<title id="odata-batch-envelope-en-title">OData batch envelope and atomic groups</title><desc>The outer envelope reduces HTTP packaging overhead; it does not establish one universal database transaction.</desc><clipPath id="odata-batch-envelope-en-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="odata-batch-envelope-en-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#odata-batch-envelope-en-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #10191f; fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">One HTTP batch can contain several transaction groups</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #aabdc6; stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Think in atomic groups, not in envelopes</text>
			<rect x="38" y="115" width="804" height="324" rx="8" ry="8" style="stroke: #e7eff2; stroke-linecap: butt; stroke-width: 1; fill: #203540; fill-rule: evenodd;" />
			<text x="56" y="410" style="font-family:Arial,Helvetica,sans-serif; font-size: 16px;fill: #e7eff2; stroke:none;font-weight:700;" transform="translate(0,820) scale(1,-1)" data-label-width="778.0">HTTP BATCH ENVELOPE</text>
			<rect x="61" y="182" width="235" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="61" y="324" width="235" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="75" y="337" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,674) scale(1,-1)" data-label-width="213.0">Atomic group A</text>
			<text x="75" y="299" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,598) scale(1,-1)" data-label-width="213.0">Update order + create item.</text>
			<text x="75" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="213.0">A failure inside this group</text>
			<text x="75" y="261" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,522) scale(1,-1)" data-label-width="213.0">prevents partial success</text>
			<text x="75" y="242" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,484) scale(1,-1)" data-label-width="213.0">within the group.</text>
			<rect x="324" y="182" width="235" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="324" y="324" width="235" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="338" y="337" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,674) scale(1,-1)" data-label-width="213.0">Atomic group B</text>
			<text x="338" y="299" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,598) scale(1,-1)" data-label-width="213.0">A separate group has its</text>
			<text x="338" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="213.0">own atomicity boundary. Do</text>
			<text x="338" y="261" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,522) scale(1,-1)" data-label-width="213.0">not assume group A can roll</text>
			<text x="338" y="242" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,484) scale(1,-1)" data-label-width="213.0">it back.</text>
			<rect x="587" y="182" width="230" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #192730; fill-rule: evenodd;" />
			<rect x="587" y="324" width="230" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #9bdac1; fill-rule: evenodd;" />
			<text x="601" y="337" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: #192730; stroke:none;font-weight:700;" transform="translate(0,674) scale(1,-1)" data-label-width="208.0">Other request</text>
			<text x="601" y="299" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,598) scale(1,-1)" data-label-width="208.0">A read or another request</text>
			<text x="601" y="280" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,560) scale(1,-1)" data-label-width="208.0">may also appear in the</text>
			<text x="601" y="261" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,522) scale(1,-1)" data-label-width="208.0">envelope, subject to</text>
			<text x="601" y="242" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: #e7eff2; stroke:none;" transform="translate(0,484) scale(1,-1)" data-label-width="208.0">protocol rules.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: #382c23; fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">OData V2 changesets and OData V4 atomicity grouping are protocol-specific. Confirm service support and</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: #e7eff2; stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">dependencies.</text>
		</g>
	</g>
</svg>