<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="idoc-aif-lifecycle-en-title" lang="en" class="selectable-diagram">
	<title id="idoc-aif-lifecycle-en-title">IDoc processing and AIF operations</title><desc>Follow the message to the business outcome. The AIF band represents supported configured capabilities, not an obligatory stage for every IDoc.</desc><clipPath id="idoc-aif-lifecycle-en-clip">
