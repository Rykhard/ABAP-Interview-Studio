			<text x="614" y="373" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,746) scale(1,-1)" data-label-width="220.0">Confirm the actual posting</text>
			<text x="614" y="354" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,708) scale(1,-1)" data-label-width="220.0">result and preserve</text>
			<text x="614" y="335" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,670) scale(1,-1)" data-label-width="220.0">correlation to the interface</text>
