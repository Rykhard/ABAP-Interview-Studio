	<title id="patterns-chain-command-en-title">First-match routing and idempotent command execution</title><desc>The 700 EUR fixture passes the team-lead rule and stops at the manager rule. The selected operation then needs its own durable identity to handle duplicate delivery safely.</desc><clipPath id="patterns-chain-command-en-clip">
