<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="btp-account-runtime-en-title" lang="en" class="selectable-diagram">
	<title id="btp-account-runtime-en-title">BTP account and runtime map</title><desc>Read the nesting as an organizational example, then distinguish the application, service instance and credentials.</desc><clipPath id="btp-account-runtime-en-clip">
