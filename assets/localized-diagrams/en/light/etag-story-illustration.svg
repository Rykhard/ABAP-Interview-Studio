<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" role="img" aria-labelledby="etag-story-illustration-en-title" lang="en" class="selectable-diagram"><title id="etag-story-illustration-en-title">Two editors and one version: an illustrated story</title><desc>Alice and Ben read version 7. Alice updates successfully, producing version 8. Ben must not overwrite that newer state using the stale version 7 precondition.</desc><rect x="0" y="0" width="880" height="580" rx="8" fill="rgb(95%,96%,96%)" /><rect x="24" y="35" width="832" height="154" rx="8" fill="rgb(100%,100%,100%)" /><text x="42" y="67" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:rgb(7%,39%,32%);" data-label-width="806.0">1. Both read V7</text><text x="42" y="100" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">Alice and Ben read the same record. Both receive its current ETag,</text><text x="42" y="123" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">represented here as V7.</text><rect x="24" y="209" width="832" height="154" rx="8" fill="rgb(100%,100%,100%)" /><text x="42" y="241" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:rgb(7%,39%,32%);" data-label-width="806.0">2. Alice saves</text><text x="42" y="274" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">Her If-Match V7 matches the current record. The update succeeds and produces</text><text x="42" y="297" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">a new ETag, V8.</text><rect x="24" y="383" width="832" height="154" rx="8" fill="rgb(100%,100%,100%)" /><text x="42" y="415" style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:700;fill:rgb(7%,39%,32%);" data-label-width="806.0">3. Ben is stale</text><text x="42" y="448" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">His If-Match V7 no longer matches V8. The update is rejected; he must</text><text x="42" y="471" style="font-family:Arial,Helvetica,sans-serif; font-size:17px;fill:rgb(7%,16%,24%);" data-label-width="806.0">refresh and resolve the conflict.</text></svg>