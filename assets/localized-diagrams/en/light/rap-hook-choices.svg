<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="rap-hook-choices-en-title" lang="en" class="selectable-diagram">
	<title id="rap-hook-choices-en-title">RAP hook responsibilities</title><desc>Read each card as a separate design question; this is not an execution sequence.</desc><clipPath id="rap-hook-choices-en-clip">
		<rect x="0" y="0" width="880" height="560" />
	</clipPath>
	<g id="rap-hook-choices-en-group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#rap-hook-choices-en-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(95%,96%,96%); fill-rule: evenodd;" />
			<text x="28" y="518" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,1036) scale(1,-1)" data-label-width="844.0">Four hooks answer four different questions</text>
			<text x="28" y="490" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,980) scale(1,-1)" data-label-width="844.0">Choose by responsibility and supported trigger, not by an assumed method order</text>
			<rect x="38" y="282" width="386" height="166" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="38" y="409" width="386" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="52" y="422" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,844) scale(1,-1)" data-label-width="364.0">Precheck: accept this request?</text>
			<text x="52" y="384" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,768) scale(1,-1)" data-label-width="364.0">Check incoming changes before they are applied</text>
			<text x="52" y="365" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,730) scale(1,-1)" data-label-width="364.0">to the transactional buffer. Example: reject an</text>
			<text x="52" y="346" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,692) scale(1,-1)" data-label-width="364.0">invalid requested transition.</text>
			<rect x="456" y="282" width="386" height="166" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="456" y="409" width="386" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="470" y="422" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,844) scale(1,-1)" data-label-width="364.0">Determination: derive what?</text>
			<text x="470" y="384" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,768) scale(1,-1)" data-label-width="364.0">Derive values after relevant triggers. Example:</text>
			<text x="470" y="365" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,730) scale(1,-1)" data-label-width="364.0">calculate a default or dependent field. Design</text>
			<text x="470" y="346" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,692) scale(1,-1)" data-label-width="364.0">repeated execution to be safe.</text>
			<rect x="38" y="104" width="386" height="158" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="38" y="223" width="386" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="52" y="236" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,472) scale(1,-1)" data-label-width="364.0">Validation: may this be saved?</text>
			<text x="52" y="198" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,396) scale(1,-1)" data-label-width="364.0">Check consistency at supported validation</text>
			<text x="52" y="179" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,358) scale(1,-1)" data-label-width="364.0">points. Example: a mandatory approval reason</text>
			<text x="52" y="160" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,320) scale(1,-1)" data-label-width="364.0">must be present.</text>
			<rect x="456" y="104" width="386" height="158" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<rect x="456" y="223" width="386" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;" />
			<text x="470" y="236" style="font-family:Arial,Helvetica,sans-serif; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;font-weight:700;" transform="translate(0,472) scale(1,-1)" data-label-width="364.0">Action: do which business operation?</text>
			<text x="470" y="198" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,396) scale(1,-1)" data-label-width="364.0">An explicit operation, such as Submit. It may</text>
			<text x="470" y="179" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,358) scale(1,-1)" data-label-width="364.0">modify state and return a result under its</text>
			<text x="470" y="160" style="font-family:Arial,Helvetica,sans-serif; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,320) scale(1,-1)" data-label-width="364.0">declared contract.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,94%,88%); fill-rule: evenodd;" />
			<text x="42" y="60" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,120) scale(1,-1)" data-label-width="802.0">Unmanaged RAP determinations and validations have draft-specific support. Implement active-instance</text>
			<text x="42" y="42" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,84) scale(1,-1)" data-label-width="802.0">checks in supported handlers/save logic.</text>
		</g>
	</g>
</svg>