<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 470" version="1.0" fill-rule="evenodd" role="img" aria-labelledby="extensibility-decision-en-title" lang="en" class="selectable-diagram">
	<title id="extensibility-decision-en-title">Extension placement decision</title><desc>Start from the business need and transaction boundary before choosing an extension location.</desc><clipPath id="extensibility-decision-en-clip">
		<rect x="0" y="0" width="880" height="470" />
	</clipPath>
	<g id="extensibility-decision-en-group" transform="scale(1,-1) translate(0,-470)" style="clip-path: url(#extensibility-decision-en-clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="470" rx="9" ry="9" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(95%,96%,96%); fill-rule: evenodd;" />
			<text x="30" y="430" style="font-family:Arial,Helvetica,sans-serif; font-size: 25px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,860) scale(1,-1)" data-label-width="842.0">Choose an extension approach</text>
			<text x="30" y="403" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,806) scale(1,-1)" data-label-width="842.0">Start with the business requirement, supported contracts and transaction boundary</text>
			<rect x="30" y="304" width="820" height="66" rx="9" ry="9" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<text x="46" y="345" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,39%,32%); stroke:none;font-weight:700;" transform="translate(0,690) scale(1,-1)" data-label-width="118.0">First</text>
			<text x="170" y="345" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,690) scale(1,-1)" data-label-width="672.0">Can standard functionality or configuration meet the need?</text>
			<text x="170" y="322" style="font-family:Arial,Helvetica,sans-serif; font-size: 10.5px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,644) scale(1,-1)" data-label-width="672.0">Use the standard capability and avoid unnecessary custom code.</text>
			<rect x="30" y="227" width="820" height="66" rx="9" ry="9" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<text x="46" y="268" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,39%,32%); stroke:none;font-weight:700;" transform="translate(0,536) scale(1,-1)" data-label-width="118.0">Key user</text>
			<text x="170" y="268" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,536) scale(1,-1)" data-label-width="672.0">Does a delivered business context cover the adaptation?</text>
			<text x="170" y="245" style="font-family:Arial,Helvetica,sans-serif; font-size: 10.5px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,490) scale(1,-1)" data-label-width="672.0">Use supported custom fields, logic or UI adaptation tools.</text>
			<rect x="30" y="150" width="820" height="66" rx="9" ry="9" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<text x="46" y="191" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,39%,32%); stroke:none;font-weight:700;" transform="translate(0,382) scale(1,-1)" data-label-width="118.0">On-stack</text>
			<text x="170" y="191" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,382) scale(1,-1)" data-label-width="672.0">Does the logic need local transactional consistency?</text>
			<text x="170" y="168" style="font-family:Arial,Helvetica,sans-serif; font-size: 10.5px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,336) scale(1,-1)" data-label-width="672.0">Use released local contracts and suitable ABAP Cloud extensibility.</text>
			<rect x="30" y="73" width="820" height="66" rx="9" ry="9" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;" />
			<text x="46" y="114" style="font-family:Arial,Helvetica,sans-serif; font-size: 13px;fill: rgb(7%,39%,32%); stroke:none;font-weight:700;" transform="translate(0,228) scale(1,-1)" data-label-width="118.0">Side-by-side</text>
			<text x="170" y="114" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,228) scale(1,-1)" data-label-width="672.0">Does the process need an independent or cross-system app?</text>
			<text x="170" y="91" style="font-family:Arial,Helvetica,sans-serif; font-size: 10.5px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,182) scale(1,-1)" data-label-width="672.0">Use supported remote APIs and events; design retries and consistency.</text>
			<text x="30" y="37" style="font-family:Arial,Helvetica,sans-serif; font-size: 12px;fill: rgb(7%,16%,24%); stroke:none;font-weight:700;" transform="translate(0,74) scale(1,-1)" data-label-width="842.0">Placement does not determine the Clean Core level. Check dependencies separately.</text>
		</g>
	</g>
</svg>