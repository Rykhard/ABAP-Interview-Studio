	<title id="deep-duplicates-ranges-en-title">Duplicate insertion and empty authorization boundaries</title><desc>A duplicate unique key preserves the original row for the specified insertion form. An initial selection range has a very different meaning from an empty list of permissions.</desc><clipPath id="deep-duplicates-ranges-en-clip">
