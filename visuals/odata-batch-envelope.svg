<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg
  PUBLIC '-//W3C//DTD SVG 1.0//EN'
  'http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd'>
<svg width="880" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>...</title>
	<desc>...</desc>
	<clipPath id="clip">
		<rect x="0" y="0" width="880" height="560"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#clip)">
		<g transform="">
			<rect x="0" y="0" width="880" height="560" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(95%,96%,96%); fill-rule: evenodd;"/>
			<text x="28" y="518" style="font-family: Helvetica-Bold; font-size: 25px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,1036) scale(1,-1)">One HTTP batch can contain several transaction groups</text>
			<text x="28" y="490" style="font-family: Helvetica; font-size: 13px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,980) scale(1,-1)">Think in atomic groups, not in envelopes</text>
			<rect x="38" y="115" width="804" height="324" rx="8" ry="8" style="stroke: rgb(7%,16%,24%); stroke-linecap: butt; stroke-width: 1; fill: rgb(89%,92%,94%); fill-rule: evenodd;"/>
			<text x="56" y="410" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,820) scale(1,-1)">HTTP BATCH ENVELOPE</text>
			<rect x="61" y="182" width="235" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<rect x="61" y="324" width="235" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;"/>
			<text x="75" y="337" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,674) scale(1,-1)">Atomic group A</text>
			<text x="75" y="299" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,598) scale(1,-1)">Update order + create item.</text>
			<text x="75" y="280" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,560) scale(1,-1)">A failure inside this group</text>
			<text x="75" y="261" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,522) scale(1,-1)">prevents partial success</text>
			<text x="75" y="242" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,484) scale(1,-1)">within the group.</text>
			<rect x="324" y="182" width="235" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<rect x="324" y="324" width="235" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;"/>
			<text x="338" y="337" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,674) scale(1,-1)">Atomic group B</text>
			<text x="338" y="299" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,598) scale(1,-1)">A separate group has its</text>
			<text x="338" y="280" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,560) scale(1,-1)">own atomicity boundary. Do</text>
			<text x="338" y="261" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,522) scale(1,-1)">not assume group A can roll</text>
			<text x="338" y="242" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,484) scale(1,-1)">it back.</text>
			<rect x="587" y="182" width="230" height="181" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<rect x="587" y="324" width="230" height="39" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,39%,32%); fill-rule: evenodd;"/>
			<text x="601" y="337" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,674) scale(1,-1)">Other request</text>
			<text x="601" y="299" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,598) scale(1,-1)">A read or another request</text>
			<text x="601" y="280" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,560) scale(1,-1)">may also appear in the</text>
			<text x="601" y="261" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,522) scale(1,-1)">envelope, subject to</text>
			<text x="601" y="242" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,484) scale(1,-1)">protocol rules.</text>
			<rect x="28" y="24" width="824" height="57" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,94%,88%); fill-rule: evenodd;"/>
			<text x="42" y="60" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,120) scale(1,-1)">OData V2 changesets and OData V4 atomicity grouping are protocol-specific. Confirm service support and</text>
			<text x="42" y="42" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,84) scale(1,-1)">dependencies.</text>
		</g>
	</g>
</svg>
