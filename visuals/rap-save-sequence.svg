			<text x="28" y="704" style="font-family: Helvetica-Bold; font-size: 23px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,1408) scale(1,-1)">RAP save sequence: one order, step by step</text>
			<text x="28" y="680" style="font-family: Helvetica; font-size: 14px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,1360) scale(1,-1)">Prepare and check first. Then assign the final number and write.</text>
			<rect x="28" y="582" width="530" height="80" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
