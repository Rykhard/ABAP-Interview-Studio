			<text x="620" y="397" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(7%,39%,32%); stroke:none;" transform="translate(0,794) scale(1,-1)">Late save</text>
			<text x="620" y="371" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,742) scale(1,-1)">Ordinary business checks must</text>
			<text x="620" y="353" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,706) scale(1,-1)">already have passed. A</text>
			<text x="620" y="335" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,670) scale(1,-1)">technical failure is not</text>
			<text x="620" y="317" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,634) scale(1,-1)">impossible.</text>
			<text x="620" y="287" style="font-family: Helvetica; font-size: 12px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,574) scale(1,-1)">Special BAPI failure handling</text>
			<text x="620" y="270" style="font-family: Helvetica; font-size: 12px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,540) scale(1,-1)">needs the documented saver</text>
