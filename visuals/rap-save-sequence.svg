			<rect x="30" y="187" width="526" height="35" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(89%,94%,92%); fill-rule: evenodd;"/>
			<text x="43" y="199" style="font-family: Helvetica-Bold; font-size: 13px;fill: rgb(7%,39%,32%); stroke:none;" transform="translate(0,398) scale(1,-1)">Transaction owner completes the database commit</text>
			<rect x="606" y="460" width="246" height="196" rx="8" ry="8" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="620" y="630" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(74%,32%,12%); stroke:none;" transform="translate(0,1260) scale(1,-1)">Early failure path</text>
