			<text x="42" y="516" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,1032) scale(1,-1)">Check that the delivery date is valid.</text>
			<text x="42" y="495" style="font-family: Helvetica; font-size: 12px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,990) scale(1,-1)">All involved BOs must pass the checks.</text>
