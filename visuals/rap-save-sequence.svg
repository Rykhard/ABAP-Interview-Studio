			<text x="42" y="293" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(7%,39%,32%); stroke:none;" transform="translate(0,586) scale(1,-1)">4  SAVE  (persistence phase)</text>
			<text x="42" y="270" style="font-family: Helvetica; font-size: 14px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,540) scale(1,-1)">Write the order and its items.</text>
			<text x="42" y="249" style="font-family: Helvetica; font-size: 12px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,498) scale(1,-1)">The implementation depends on the save option.</text>
