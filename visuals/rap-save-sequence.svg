			<text x="620" y="539" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(74%,32%,12%); stroke:none;" transform="translate(0,1078) scale(1,-1)">CLEANUP_FINALIZE</text>
			<text x="620" y="513" style="font-family: Helvetica; font-size: 13px;fill: rgb(7%,16%,24%); stroke:none;" transform="translate(0,1026) scale(1,-1)">Run early-failure cleanup;</text>
