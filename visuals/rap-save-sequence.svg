			<text x="28" y="24" style="font-family: Helvetica; font-size: 12px;fill: rgb(32%,41%,48%); stroke:none;" transform="translate(0,48) scale(1,-1)">Runtime phases, not five methods you must implement in every BO. No commit inside a handler or saver.</text>
